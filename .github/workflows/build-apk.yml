name: APK

# Chaque poussée produit un APK téléchargeable. C'est le critère de fin de
# l'itération 1 : plus jamais de build « qui marche sur ma machine ».
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # Capacitor 8 exige un JDK 21.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # Les mêmes paquets que sur le poste de développement, pour que l'échec
      # d'un build en CI ne puisse jamais venir d'une version de SDK différente.
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      # `npm ci` et non `npm install` : la CI installe exactement le contenu du
      # lockfile, sans jamais le mettre à jour au passage.
      - run: npm ci

      - run: npm run build

      # Recopie `dist/` dans les ressources Android. Ces fichiers sont ignorés
      # par git, donc cette étape n'est pas optionnelle.
      - run: npx cap sync android

      - run: ./gradlew assembleDebug --no-daemon
        working-directory: android

      - uses: actions/upload-artifact@v7
        with:
          name: zone2-debug-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
