name: APK

# Chaque poussée produit un APK téléchargeable. C'est le critère de fin de
# l'itération 1 : plus jamais de build « qui marche sur ma machine ».
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Barrière : aucun APK n'est construit si un secret a fui dans l'historique.
  # Le dépôt étant public, une clé exposée doit être considérée comme compromise
  # dès la seconde où elle est poussée — la détecter après coup ne sert à rien,
  # d'où la vérification systématique.
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Historique complet : un secret introduit puis « corrigé » au commit
          # suivant reste exploitable, et resterait invisible à un scan partiel.
          fetch-depth: 0

      - name: Analyse de l'historique avec gitleaks
        run: |
          VERSION=8.30.1
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git --no-banner --redact --exit-code 1 .

  build:
    needs: secrets
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # Capacitor 8 exige un JDK 21.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # Les mêmes paquets que sur le poste de développement, pour que l'échec
      # d'un build en CI ne puisse jamais venir d'une version de SDK différente.
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      # `npm ci` et non `npm install` : la CI installe exactement le contenu du
      # lockfile, sans jamais le mettre à jour au passage.
      - run: npm ci

      - run: npm run build

      # Recopie `dist/` dans les ressources Android. Ces fichiers sont ignorés
      # par git, donc cette étape n'est pas optionnelle.
      - run: npx cap sync android

      - run: ./gradlew assembleDebug --no-daemon
        working-directory: android

      - uses: actions/upload-artifact@v7
        with:
          name: zone2-debug-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

  # Publie l'APK sous une adresse fixe, installable en un geste depuis le
  # téléphone. Un artefact d'Actions ne convient pas pour ça : il est livré dans
  # un ZIP et exige d'être authentifié — deux obstacles de trop quand on est
  # debout dans une salle de sport.
  publication:
    needs: build
    # Uniquement sur `main` : une PR ne doit rien publier, et son jeton est en
    # lecture seule de toute façon.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: zone2-debug-${{ github.sha }}

      - name: Republier la release « latest »
        env:
          GH_TOKEN: ${{ github.token }}
          DEPOT: ${{ github.repository }}
          REVISION: ${{ github.sha }}
        run: |
          mv app-debug.apk zone2.apk
          # La release est recréée plutôt que modifiée : c'est le seul moyen de
          # faire suivre l'étiquette `latest` jusqu'au dernier commit.
          gh release delete latest --yes --cleanup-tag --repo "$DEPOT" || true
          gh release create latest zone2.apk \
            --repo "$DEPOT" \
            --target "$REVISION" \
            --title "Dernier build" \
            --notes "APK de développement construit automatiquement depuis \`main\`.

          Signé avec la clé de debug — destiné à l'installation manuelle, pas à une distribution.

          Révision : \`${REVISION}\`"
