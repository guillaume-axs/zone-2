name: APK

# Chaque poussée produit un APK téléchargeable. C'est le critère de fin de
# l'itération 1 : plus jamais de build « qui marche sur ma machine ».
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Barrière : aucun APK n'est construit si un secret a fui dans l'historique.
  # Le dépôt étant public, une clé exposée doit être considérée comme compromise
  # dès la seconde où elle est poussée — la détecter après coup ne sert à rien,
  # d'où la vérification systématique.
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Historique complet : un secret introduit puis « corrigé » au commit
          # suivant reste exploitable, et resterait invisible à un scan partiel.
          fetch-depth: 0

      - name: Analyse de l'historique avec gitleaks
        run: |
          VERSION=8.30.1
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git --no-banner --redact --exit-code 1 .

  build:
    needs: secrets
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # Capacitor 8 exige un JDK 21.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # Les mêmes paquets que sur le poste de développement, pour que l'échec
      # d'un build en CI ne puisse jamais venir d'une version de SDK différente.
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      # `npm ci` et non `npm install` : la CI installe exactement le contenu du
      # lockfile, sans jamais le mettre à jour au passage.
      - run: npm ci

      # Avant le build : un calcul faux ne se voit jamais à l'écran,
      # contrairement à un bouton mal placé.
      - run: npm test

      - run: npm run build

      # Recopie `dist/` dans les ressources Android. Ces fichiers sont ignorés
      # par git, donc cette étape n'est pas optionnelle.
      - run: npx cap sync android

      # Le décodage des trames de la ceinture est du Kotlin pur : il se vérifie
      # sans téléphone et sans capteur. C'est la seule pièce de la capture BLE
      # qu'on puisse éprouver ailleurs que sur le vélo — elle ne passera donc
      # jamais sans avoir été testée.
      - run: ./gradlew testDebugUnitTest --no-daemon
        working-directory: android

      # La clé de signature vient des secrets du dépôt, jamais du dépôt
      # lui-même — il est public. Elle est écrite hors de l'arborescence du
      # projet, et la machine est détruite à la fin du job.
      - name: Restituer la clé de signature
        env:
          CLE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$CLE" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 absent : l'APK sortirait non signé."
            exit 1
          fi
          printf '%s' "$CLE" | base64 -d > "$RUNNER_TEMP/zone2.keystore"

      # Release et non debug : un APK de debug est extractible au câble, et
      # celui-ci contient des données de santé. Signé par une clé stable, il
      # s'installe par-dessus le précédent sans effacer la base.
      - run: ./gradlew assembleRelease --no-daemon
        working-directory: android
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/zone2.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}

      # Sans signature, Gradle produit `app-release-unsigned.apk` : l'absence
      # du fichier attendu fait donc échouer le build, ce qui est voulu.
      - uses: actions/upload-artifact@v7
        with:
          name: zone2-${{ github.sha }}
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

  # Publie l'APK sous une adresse fixe, installable en un geste depuis le
  # téléphone. Un artefact d'Actions ne convient pas pour ça : il est livré dans
  # un ZIP et exige d'être authentifié — deux obstacles de trop quand on est
  # debout dans une salle de sport.
  publication:
    needs: build
    # Uniquement sur `main` : une PR ne doit rien publier, et son jeton est en
    # lecture seule de toute façon.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: zone2-${{ github.sha }}

      - name: Republier la release « latest »
        env:
          GH_TOKEN: ${{ github.token }}
          DEPOT: ${{ github.repository }}
          REVISION: ${{ github.sha }}
        run: |
          mv app-release.apk zone2.apk
          # La release est recréée plutôt que modifiée : c'est le seul moyen de
          # faire suivre l'étiquette `latest` jusqu'au dernier commit.
          gh release delete latest --yes --cleanup-tag --repo "$DEPOT" || true
          gh release create latest zone2.apk \
            --repo "$DEPOT" \
            --target "$REVISION" \
            --title "Dernier build" \
            --notes "APK de développement construit automatiquement depuis \`main\`.

          Signé avec la clé de release du projet : il s'installe par-dessus la version précédente sans effacer les données.

          Révision : \`${REVISION}\`"
